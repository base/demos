name: 200ms demo

on:
  pull_request:
    paths:
      - "200ms-demo/**"
      - ".github/workflows/test-200ms-demo.yml"
  push:
    branches: [master]
    paths:
      - "200ms-demo/**"
      - ".github/workflows/test-200ms-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 200ms-demo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 200ms-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test exact rate math
        run: npm run test:math

      - name: Build the hosted path
        run: npm run build:pages
