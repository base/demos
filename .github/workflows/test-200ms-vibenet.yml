name: 200ms Vibenet

on:
  pull_request:
    paths:
      - "200ms-vibenet/**"
      - ".github/workflows/test-200ms-vibenet.yml"
  push:
    branches: [master]
    paths:
      - "200ms-vibenet/**"
      - ".github/workflows/test-200ms-vibenet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 200ms-vibenet
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 200ms-vibenet/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test exact rate math
        run: npm run test:math

      - name: Build the hosted path
        run: npm run build:pages
