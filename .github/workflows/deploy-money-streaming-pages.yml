name: Money Streaming Pages

on:
  pull_request:
    paths:
      - "money-streaming-vibenet/**"
      - ".github/workflows/deploy-money-streaming-pages.yml"
  push:
    branches: [master]
    paths:
      - "money-streaming-vibenet/**"
      - ".github/workflows/deploy-money-streaming-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money-streaming-vibenet
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: money-streaming-vibenet/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test exact rate math
        run: npm run test:math

      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: money-streaming-vibenet/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
